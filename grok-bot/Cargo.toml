[package]
name = "steery-driver-grok-bot"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Steery driver for Grok Bot's native gateway"

[[bin]]
name = "steery-driver-grok-bot"
path = "src/main.rs"

[dependencies]
steery-sdk = { version = "1.0.0", path = "../../steery-grokbot-cutover/crates/steery-sdk" }
chrono = { version = "0.4", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt", "macros", "process", "time", "io-util", "io-std", "sync", "fs"] }

[workspace]
