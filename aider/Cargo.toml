[package]
name = "steery-driver-aider"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Steery's driver for Aider: it reads Aider's chat history files and drives Aider's turns through `aider --message-file`."

[dependencies]
steery-sdk = { git = "https://github.com/steery-dev/sdk", tag = "v15.0.0" }
steery-driver-common = { path = "../common" }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "rt-multi-thread", "signal", "sync", "time"] }

[lints.rust]
unsafe_code = "forbid"

# Its own workspace, so it builds alone.
[workspace]
