[package]
name = "steery-driver-canvas"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Steery's driver for the canvas harness: it reads the canvas's JSONL transcripts and drives its turns through `canvas turn`."

[dependencies]
steery-sdk = { git = "https://github.com/steery-dev/sdk", tag = "v19.0.0" }
steery-driver-common = { path = "../common" }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "rt-multi-thread", "signal", "sync", "time"] }

[lints.rust]
unsafe_code = "forbid"

# Its own workspace, so it builds alone.
[workspace]
