[package]
name = "steery-driver-codex"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Steery's driver for Codex: it reads Codex's conversations, plans its setup, and starts, steers and stops Codex turns through Codex's own app server."

[dependencies]
steery-sdk = { git = "https://github.com/steery-dev/sdk", tag = "v3.10.0" }
steery-driver-common = { path = "../common" }
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
chrono = { version = "0.4", default-features = false, features = ["std", "now"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = { version = "0.38", features = ["serialize"] }
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
toml = "1"
uuid = { version = "1", features = ["v4", "v7"] }

[lints.rust]
unsafe_code = "forbid"

# Its own workspace, so it builds alone.
[workspace]
