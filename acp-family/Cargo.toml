[package]
name = "steery-driver-acp-family"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Steery's drivers for the harnesses that speak the Agent Client Protocol: they read the harness's conversations, plan its setup and read its moments."

[[bin]]
name = "steery-driver-grok"
path = "src/bin/grok.rs"

[[bin]]
name = "steery-driver-copilot"
path = "src/bin/copilot.rs"

[[bin]]
name = "steery-driver-opencode"
path = "src/bin/opencode.rs"

[[bin]]
name = "steery-driver-hermes"
path = "src/bin/hermes.rs"

[[bin]]
name = "steery-driver-kilo"
path = "src/bin/kilo.rs"

[[bin]]
name = "steery-driver-cursor"
path = "src/bin/cursor.rs"

[[bin]]
name = "steery-driver-cline"
path = "src/bin/cline.rs"

[[bin]]
name = "steery-driver-goose"
path = "src/bin/goose.rs"

[[bin]]
name = "steery-driver-gemini"
path = "src/bin/gemini.rs"

[[bin]]
name = "steery-driver-antigravity"
path = "src/bin/antigravity.rs"

[[bin]]
name = "steery-driver-qwen"
path = "src/bin/qwen.rs"

[[bin]]
name = "steery-driver-openclaw"
path = "src/bin/openclaw.rs"

[[bin]]
name = "steery-driver-droid"
path = "src/bin/droid.rs"

[dependencies]
steery-sdk = { git = "https://github.com/steery-dev/sdk", tag = "v14.0.0" }
steery-driver-common = { path = "../common" }
# Kilo, Hermes, Cursor, OpenCode, Cline, Goose and OpenClaw keep their conversations in SQLite; bundled, so no system library is needed.
rusqlite = { version = "0.32", features = ["bundled"] }
# OpenClaw packs large records of its store in zstd; a decoder in Rust, so no C library is cross-built.
ruzstd = "0.9"
# Cursor: whether a process still holds a chat's SQLite store open.
libc = "0.2"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
memchr = "2"
# Qwen Code: the hash under which `mcpApprovals.json` approves a server.
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "process", "time", "io-util", "sync", "signal", "net"] }
listeners = "0.6"
# Cline's hub: a websocket on a loopback port.
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }

# Its own workspace, so it builds alone.
[workspace]
