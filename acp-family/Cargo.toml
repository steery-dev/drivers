[package]
name = "steery-driver-acp-family"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Steery's drivers for the harnesses that speak the Agent Client Protocol: they read the harness's conversations, plan its setup and read its moments."

[[bin]]
name = "steery-driver-grok"
path = "src/bin/grok.rs"

[[bin]]
name = "steery-driver-hermes"
path = "src/bin/hermes.rs"

[[bin]]
name = "steery-driver-kilo"
path = "src/bin/kilo.rs"

[[bin]]
name = "steery-driver-cursor"
path = "src/bin/cursor.rs"

[[bin]]
name = "steery-driver-gemini"
path = "src/bin/gemini.rs"

[dependencies]
steery-sdk = { git = "https://github.com/steery-dev/sdk", tag = "v14.0.0" }
steery-driver-common = { path = "../common" }
# Kilo, Hermes and Cursor keep their conversations in SQLite; bundled, so no system library is needed.
rusqlite = { version = "0.32", features = ["bundled"] }
# Cursor: whether a process still holds a chat's SQLite store open.
libc = "0.2"
chrono = { version = "0.4", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
memchr = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "process", "time", "io-util", "sync"] }

# Its own workspace, so it builds alone.
[workspace]
