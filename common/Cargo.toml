[package]
name = "steery-driver-common"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "What Steery's drivers share: finding and asking a harness's executable, reading a transcript's records within bounds, following a file only appended to, a transcript that is a tree of records, a delivery's receipt in a transcript, a read that said nothing answered again while its files stand as they did, and the MCP servers a harness's JSON configuration names."

[dependencies]
steery-sdk = { git = "https://github.com/steery-dev/sdk", rev = "d3704c186cf852602c803fd2bd8d56796e847334" }
serde_json = "1"
tokio = { version = "1", features = ["process", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }

# Its own workspace, so it builds alone.
[workspace]
