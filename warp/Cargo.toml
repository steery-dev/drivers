[package]
name = "steery-driver-warp"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Steery's driver for Warp: it reads the conversations of Warp's agent from Warp's SQLite stores and plans Warp's setup."

[dependencies]
steery-sdk = { git = "https://github.com/steery-dev/sdk", tag = "v15.0.0" }
steery-driver-common = { path = "../common" }
base64 = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "rt-multi-thread", "sync", "time"] }

[lints.rust]
unsafe_code = "forbid"

# Its own workspace, so it builds alone.
[workspace]
