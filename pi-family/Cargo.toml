[package]
name = "steery-driver-pi-family"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Steery's drivers for omp and pi: they read the harness's conversations, plan its setup, read its moments, and say how to start, read and resume a turn."

[[bin]]
name = "steery-driver-omp"
path = "src/bin/omp.rs"

[[bin]]
name = "steery-driver-pi"
path = "src/bin/pi.rs"

[dependencies]
steery-sdk = { git = "https://github.com/steery-dev/sdk", tag = "v3.0.0" }
steery-driver-common = { path = "../common" }
chrono = { version = "0.4", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "macros", "process", "time", "io-util"] }

# Its own workspace, so it builds alone.
[workspace]
